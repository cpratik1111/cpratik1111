<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hub | Home</title>
    <meta name="description" content="A curated collection of resources for Android, Mac, iPhone, and Useful Websites.">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Material Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <span class="material-symbols-outlined logo-icon">hub</span>
                    <h1>My Hub</h1>
                </div>
                <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu">
                    <span class="material-symbols-outlined">menu</span>
                </button>
                <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch to dark theme">
                    <span class="material-symbols-outlined">dark_mode</span>
                </button>
            </div>
            
            <nav class="sidebar-nav">
                <ul id="nav-list"></ul>
            </nav>
            
            <div class="sidebar-footer">
                <p>&copy; 2026 My Hub.</p>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content" id="content-container">
            <p class="loading-message">Loading content...</p>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
